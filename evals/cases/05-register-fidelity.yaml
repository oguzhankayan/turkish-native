version: 3
cases:
- id: p41-register-sales-control
  pattern: 41
  input: Sen satışa bak.
  expected: Sen satışa bak.
- id: p41-register-formal
  pattern: 41
  input: Başvurunuz en geç 30 gün içinde sonuçlandırılır.
  instruction: Keep formal register; do not make it chatty.
  expected: Başvurunuz en geç 30 gün içinde sonuçlandırılır.
- id: p42-legal-control
  pattern: 42
  input: Tüketici sıfatıyla hareket eden kullanıcılar bakımından yürürlükteki tüketici mevzuatı uygulanır.
  expected: Tüketici sıfatıyla hareket eden kullanıcılar bakımından yürürlükteki tüketici mevzuatı uygulanır.
- id: p43-security-absolute
  pattern: 43
  input: Tarayıcın ile Klevia arasında hiçbir bilgi açıkta kalmaz.
  instruction: Keep the supported security claim but remove the unnecessary absolute.
  expected_not_contains:
  - hiçbir bilgi
- id: p43-security-slogan
  pattern: 43
  input: Güvenlik bir özellik değil, temel.
  instruction: Rewrite as a factual security statement without inventing a control.
  expected_property: must_request_or_use_supported_fact
- id: p44-command
  pattern: 44
  input: Paketi npm install -g klevia-mcp komutuyla kur.
  expected_contains:
  - npm install -g klevia-mcp
- id: p44-route
  pattern: 44
  input: MCP endpoint'i /api/mcp yolunda çalışır.
  expected_contains:
  - MCP
  - /api/mcp
- id: p45-no-invention
  pattern: 45
  input: Klevia kullanıcıların bilgilerini korur.
  instruction: Do not add encryption, certifications, retention periods, or other unsupported controls.
  expected_property: must_not_add_unsupported_claims
- id: p46-natural-control
  pattern: 46
  input: Bulamazsa uydurmaz.
  expected: Bulamazsa uydurmaz.
- id: p46-site-control
  pattern: 46
  input: Site kurmak için alan adını bağla.
  expected: Site kurmak için alan adını bağla.
- id: p47-agreement
  pattern: 47
  input: Sen sayfayı gönderir, satışı tamamlarsın.
  expected: Sen sayfayı gönderirsin, satışı tamamlarsın.
- id: p47-machine-format-control
  pattern: 47
  input: '{"score": 4.8}'
  instruction: Machine-readable JSON. Do not localize the decimal separator.
  expected: '{"score": 4.8}'
- id: p48-native-read
  pattern: 48
  input: Kaynağı belli telefon.
  expected: Numaranın nereden geldiği belli.
- id: p48-source-free
  pattern: 48
  input: Sayfa hazır şablondan mı kuruluyor?
  expected: Sayfa hazır bir şablondan mı hazırlanıyor?
- id: control-site-kur
  pattern: 46
  input: Yeni web sitesi kuruyoruz.
  expected: Yeni web sitesi kuruyoruz.
- id: control-api
  pattern: 44
  input: API anahtarını ayarlardan iptal edebilirsin.
  expected: API anahtarını ayarlardan iptal edebilirsin.
- id: control-legal
  pattern: 42
  input: Bu sözleşmeye Türkiye Cumhuriyeti hukuku uygulanır.
  expected: Bu sözleşmeye Türkiye Cumhuriyeti hukuku uygulanır.
- id: p49-we-verb-monotony
  pattern: 49
  input: "Masajdan cilt bakımına kadar hepsini yaparız.\nSeans sonrası devam önerisi veririz.\nSeansı üç adımda tamamlarız."
  instruction: Three headings from one page. Each is correct on its own; judge them as a set.
  expected_property: must_vary_sentence_shapes_across_the_set
  expected_not_contains:
  - yaparız
- id: p49-process-heading-template
  pattern: 49
  input: "Tıraş üç adımda biter.\nTemizlik üç adımda biter.\nBaskı üç adımda biter."
  instruction: The same heading on three different businesses' pages.
  expected_property: must_vary_sentence_shapes_across_the_set
- id: p49-single-we-control
  pattern: 49
  input: Sütü köyden alırız.
  instruction: One first-person-plural sentence on a page is a voice, not a tic.
  expected: Sütü köyden alırız.
- id: p49-passive-monotony
  pattern: 49
  input: "Arıza cihazla tespit edilir.\nÜcret işlem öncesi bildirilir.\nİş üç adımda tamamlanır."
  instruction: Three headings from one page.
  expected_property: must_vary_sentence_shapes_across_the_set
- id: p50-reordered-duplicate
  pattern: 50
  input: "Sofranız katkısız, üreticimiz belgeli.\nÜreticimiz belgeli, ürünümüz katkısız."
  instruction: A section heading and the band beneath it. Keep both slots filled.
  expected_property: second_slot_must_add_information
- id: p50-same-sentence-two-bands
  pattern: 50
  input: "Doğru perde evi sıcacık yapar.\nDoğru perdeyle ev sıcacık olur."
  instruction: A services heading and a band heading on one page.
  expected_property: second_slot_must_add_information
- id: p50-similar-but-different-control
  pattern: 50
  input: "Ekmeği her gün taze pişiririz.\nPastayı siparişe göre yaparız."
  instruction: Two bands that look alike but state different facts.
  expected: "Ekmeği her gün taze pişiririz.\nPastayı siparişe göre yaparız."
- id: p51-nav-echo
  pattern: 51
  input: Hizmetler
  instruction: A small label above the heading "Bakım menüsü", on a page whose navigation already has a link named "Hizmetler".
  expected_not_contains:
  - Hizmetler
- id: p51-label-earns-place-control
  pattern: 51
  input: Kadıköy · Güzellik ve bakım
  instruction: A small label above the hero heading. The navigation has no such item.
  expected: Kadıköy · Güzellik ve bakım
- id: p17-kalip-orani
  pattern: 17
  input: Yüksek kalıp oranıyla sınava hazırlıyoruz.
  instruction: A driving school advertising how many students PASS the exam.
  expected_not_contains:
  - kalıp oranı
  expected_contains:
  - geçme
- id: p17-sir-glaze
  pattern: 17
  input: Sırrını sürer, fırında özenle pişiririz.
  instruction: A ceramics workshop. The noun is the glaze.
  expected_not_contains:
  - Sırrını
  expected_contains:
  - Sırını
- id: p17-walk-in-calque
  pattern: 17
  input: Yürüyerek gelebilirsiniz; yoğun saatlerde randevu da alabilirsiniz.
  instruction: An optician answering whether an appointment is required. The source idiom is "walk in".
  expected_not_contains:
  - Yürüyerek
  expected_contains:
  - Randevusuz
- id: p12-rot-on-a-bicycle
  pattern: 12
  input: Fren, vites ve rotları usta elinden ayarlarız.
  instruction: A bicycle shop. A bicycle wheel is trued; "rot" is a car part.
  expected_not_contains:
  - rot
  expected_contains:
  - jant
- id: p47-gezdir
  pattern: 47
  input: Seçtiğiniz gayrimenkulleri gezdir, teklif veririz.
  expected_contains:
  - gezdirir
- id: p47-palamuta-kadar
  pattern: 47
  input: Mevsimine göre levrek, çipura, hamsi, palamuta kadar birçok balık.
  instruction: A list of fish, not a range.
  expected_not_contains:
  - palamuta kadar
- id: p41-sen-siz-mix
  pattern: 41
  input: Seviyene özel, hedefe odaklı.
  instruction: A section heading on a page that addresses the reader as "siz" everywhere else.
  expected_not_contains:
  - Seviyene
