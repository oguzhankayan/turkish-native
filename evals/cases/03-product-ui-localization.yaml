  pattern: 23
  input: Planını yükselt.
  instruction: Keep this if it matches a SaaS product voice; do not rewrite merely because it resembles English.
  expected: Planını yükselt.
- id: p24-action
  pattern: 24
  input: Bildirim gelince aksiyon al.
  instruction: Use the concrete action if supported; otherwise use a neutral direct verb.
