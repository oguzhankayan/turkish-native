  pattern: 22
  input: Aynı işletme için tekrar kayıt oluşturulmaz.
  expected: Aynı işletme ikinci kez eklenmez.
- id: p23-card
  pattern: 23
  input: Kart istemiyoruz.
  expected: Kredi kartı gerekmez.
