  - aksiyon al
- id: p24-close-sale
  pattern: 24
  input: Demoyu gönder ve satışı kapat.
  expected_not_contains:
  - satışı kapat
- id: p25-success
  pattern: 25
  input: İşlem başarıyla gerçekleştirilmiştir.
  expected: Kaydedildi.
- id: p26-label-button
  pattern: 26
  input: Telefon doğrulama
