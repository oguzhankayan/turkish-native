version: 3
cases:
- id: p21-orchestrator
  pattern: 21
  input: Orchestrator adayları pipeline'a taşır.
  instruction: Rewrite for a non-technical product page.
  expected_not_contains:
  - Orchestrator
  - pipeline
- id: p21-run
  pattern: 21
  input: Gerçek İstanbul run'ı tamamlandı.
  expected: Gerçek İstanbul taraması tamamlandı.
