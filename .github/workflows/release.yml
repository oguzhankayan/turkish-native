name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "SKILL.md"
      - ".claude-plugin/plugin.json"
      - "CHANGELOG.md"
      - "docs/RELEASE_v*.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.0"
        required: true
        default: "v0.5.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate-package.py
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\([^"]*\)".*/\1/p' SKILL.md | head -n 1)"
            if [ -z "$VERSION" ]; then
              echo "Could not read version from SKILL.md" >&2
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi

          NOTES="docs/RELEASE_${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Turkish Native $TAG" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Turkish Native $TAG" \
              --generate-notes
          fi
