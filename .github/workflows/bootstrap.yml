name: Bootstrap repository

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild package from bootstrap chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/turkish-native.b64
          base64 --decode /tmp/turkish-native.b64 > /tmp/turkish-native.zip
          rm -rf /tmp/turkish-native-extract
          mkdir -p /tmp/turkish-native-extract
          unzip -q /tmp/turkish-native.zip -d /tmp/turkish-native-extract
          cp -a /tmp/turkish-native-extract/turkish-native/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit public-ready package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Turkish Native v0.3.0 for OSS release"
          git push origin HEAD:main
